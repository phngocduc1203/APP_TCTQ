name: home_habit_builder
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=2.19.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # 🌏 Localization
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2

  # 💾 Storage & HTTP
  shared_preferences: ^2.3.1
  http: ^1.2.2
  provider: ^6.1.1
  flutter_dotenv: ^5.1.0

  # 🪷 Firebase (phiên bản đồng bộ thế hệ 3)
  firebase_core: ^3.6.0
  firebase_messaging: ^15.0.2

  # 📸 Image picker
  image_picker: ^0.8.7+4

  # 🕒 Notifications & Timezone
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1

  # 🤖 Generative AI
  google_generative_ai: ^0.4.6

flutter:
  generate: true
  uses-material-design: true

  assets:
    - .env

    # 🌱 Cây sen các giai đoạn
    - assets/lotus_seed_healthy.png
    - assets/lotus_seed_wilted.png
    - assets/lotus_seed_dead.png

    - assets/lotus_sprout_healthy.png
    - assets/lotus_sprout_wilted.png
    - assets/lotus_sprout_dead.png

    - assets/lotus_young_healthy.png
    - assets/lotus_young_wilted.png
    - assets/lotus_young_dead.png

    - assets/lotus_mature_healthy.png
    - assets/lotus_mature_wilted.png
    - assets/lotus_mature_dead.png

    - assets/lotus_flower_healthy.png
    - assets/lotus_flower_wilted.png
    - assets/lotus_flower_dead.png

    - assets/lotus_fruit_healthy.png
    - assets/lotus_fruit_wilted.png
    - assets/lotus_fruit_dead.png
